<div class="flex min-h-screen flex-col">
  <header class="border-b border-line">
    <nav class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-4 py-4">
      <a routerLink="/" class="font-semibold tracking-tight text-white">sundorf.me</a>
      <div class="flex items-center gap-5 text-sm">
        <a
          routerLink="/"
          routerLinkActive="text-accent"
          [routerLinkActiveOptions]="{ exact: true }"
          class="transition-colors hover:text-accent"
          >Home</a
        >
        <a routerLink="/projects" routerLinkActive="text-accent" class="transition-colors hover:text-accent"
          >Projects</a
        >
        <a [href]="githubUrl" target="_blank" rel="noopener" class="transition-colors hover:text-accent"
          >GitHub</a
        >
      </div>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-10">
    <router-outlet />
  </main>

  <footer class="border-t border-line">
    <div class="mx-auto max-w-3xl px-4 py-6 text-center text-sm text-fog">
      &copy; {{ year }} Lucy Sundorf &middot;
      <a [href]="githubUrl" target="_blank" rel="noopener" class="underline hover:text-accent">GitHub</a>
      &middot; hosted on Cloudflare
    </div>
  </footer>
</div>
